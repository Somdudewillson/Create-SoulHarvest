name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not create tag or publish release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      MOD_IS_RELEASE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: version
        run: |
          VERSION=$(grep '^mod\.version' stonecutter.properties.toml | cut -d'"' -f2)
          CHANNEL_TAG=$(grep '^mod\.channel_tag' stonecutter.properties.toml | cut -d'"' -f2)
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"
          TAG="v${FULL_VERSION}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target version: $FULL_VERSION"
          echo "Target tag: $TAG"

      - name: Check if tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "::error::Tag '$TAG' already exists on remote origin. Increment 'mod.version' in stonecutter.properties.toml before releasing."
            exit 1
          fi

      - name: Create and push git tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.13.1'

      - name: Fallback changelog if empty
        run: |
          if [ ! -s CHANGELOG.md ]; then
            echo "# Release ${{ steps.version.outputs.tag }}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "Release ${{ steps.version.outputs.version }} for Minecraft Forge 1.20.1 and NeoForge 1.21.1." >> CHANGELOG.md
          fi

      - name: Checkout RedSparkLib
        uses: actions/checkout@v4
        with:
          repository: Somdudewillson/RedSparkLib
          path: redsparklib

      - name: Setup Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and install RedSparkLib
        env:
          PUB_MAVEN_ENABLE: 'true'
          MOD_IS_RELEASE: 'false'
        run: |
          cd redsparklib
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace --console=plain
          cd ..
          rm -rf redsparklib

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jars
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Create: Soul Harvest ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG.md
          files: |
            build/libs/*/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.tag }}
          path: build/libs/
          if-no-files-found: error
