name: build

on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout RedSparkLib
        uses: actions/checkout@v4
        with:
          repository: Somdudewillson/RedSparkLib
          path: redsparklib

      - name: Setup Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and install RedSparkLib
        env:
          PUB_MAVEN_ENABLE: 'true'
          MOD_IS_RELEASE: 'false'
        run: |
          cd redsparklib
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace --console=plain
          cd ..
          rm -rf redsparklib

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/
          if-no-files-found: error
